name: One-shot Homepage Acquisition Cleanup

on:
  push:
    paths:
      - '.github/workflows/_one-shot-homepage-acquisition-cleanup.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded homepage acquisition repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path("app/page.tsx")
          text = page_path.read_text(encoding="utf-8")
          original = text

          start = text.index("function ContactModal(")
          end = text.index("export default function Page() {", start)
          text = text[:start] + text[end:]
          text = text.replace('  const [contactOpen, setContactOpen] = useState(false);\n', '')
          text = text.replace('  const [toast, setToast] = useState("");\n', '')

          start = text.index('  const showToast = (message: string) => {')
          end = text.index('  return (\n', start)
          replacement = (
              '  const openContact = (source: "website-contact" | "website-contact-popup" = "website-contact") => {\n'
              '    const params = new URLSearchParams({\n'
              '      source,\n'
              '      medium: "website",\n'
              '      campaign: source === "website-contact-popup" ? "site-contact-popup" : ""\n'
              '    });\n'
              '    window.location.href = `/contact?${params.toString()}`;\n'
              '  };\n\n'
          )
          text = text[:start] + replacement + text[end:]
          text = text.replace('setContactOpen(true)', 'openContact("website-contact-popup")')

          script_start = text.index('      <script\n        type="application/ld+json"')
          header_start = text.index('      <header>', script_start)
          faq_script = (
              '      <script\n'
              '        type="application/ld+json"\n'
              '        dangerouslySetInnerHTML={{\n'
              '          __html: JSON.stringify({\n'
              '            "@context": "https://schema.org",\n'
              '            "@type": "FAQPage",\n'
              '            mainEntity: faq.map((item) => ({\n'
              '              "@type": "Question",\n'
              '              name: item.q,\n'
              '              acceptedAnswer: { "@type": "Answer", text: item.a }\n'
              '            }))\n'
              '          })\n'
              '        }}\n'
              '      />\n'
          )
          text = text[:script_start] + faq_script + text[header_start:]

          contact_start = text.index('        <section className="container section" id="contact"')
          contact_end = text.index('        </section>', contact_start) + len('        </section>')
          contact_section = (
              '        <section className="container section" id="contact" aria-label="Contact section">\n'
              '          <div className="contact-card">\n'
              '            <SectionLabel>Contact</SectionLabel>\n'
              '            <div className="section-head" style={{ marginBottom: 10 }}>\n'
              '              <h2>Start the conversation.</h2>\n'
              '              <p>Tell Marketech Digital what you want to build, improve, automate, or grow. Your inquiry continues through our governed contact flow so it can be measured and followed up reliably.</p>\n'
              '            </div>\n'
              '            <div className="hero-actions">\n'
              '              <button className="btn btn-primary" onClick={() => openContact("website-contact")}>Continue to inquiry form →</button>\n'
              '            </div>\n'
              '          </div>\n'
              '        </section>'
          )
          text = text[:contact_start] + contact_section + text[contact_end:]

          text = '\n'.join(
              line for line in text.splitlines()
              if '<ContactModal ' not in line and '<div className={`toast ' not in line
          ) + '\n'
          marker = '\nfunction ContactFields('
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n'

          assert text != original
          assert 'abasitabbasi99@gmail.com' not in text
          assert 'mailto:' not in text
          assert 'sendEmail' not in text
          assert 'ContactModal' not in text
          assert 'ContactFields' not in text
          assert '"@type": "Organization"' not in text
          assert '"@type": "FAQPage"' in text
          assert 'window.location.href = `/contact?${params.toString()}`' in text
          page_path.write_text(text, encoding="utf-8")

          verifier_path = Path("scripts/verify-inbound-acquisition.mjs")
          verifier = verifier_path.read_text(encoding="utf-8")
          anchor = 'const layout = read("app/layout.tsx");\n'
          assert anchor in verifier
          verifier = verifier.replace(anchor, anchor + 'const homepage = read("app/page.tsx");\n', 1)
          verify_anchor = 'requireText(layout, "<AcquisitionGuard />", "global guard mount");\n\n'
          assert verify_anchor in verifier
          checks = (
              'requireText(homepage, \'window.location.href = `/contact?${params.toString()}`\', "homepage governed contact handoff");\n'
              'requireText(homepage, \'source: "website-contact" | "website-contact-popup"\', "homepage bounded contact sources");\n'
              'requireText(homepage, \'medium: "website"\', "homepage bounded contact medium");\n'
              'requireText(homepage, \'"@type": "FAQPage"\', "homepage FAQ structured data");\n'
              'forbidText(homepage, \'"@type": "Organization"\', "duplicate homepage organization structured data");\n'
              'forbidText(homepage, "abasitabbasi99@gmail.com", "personal Gmail public contact bypass");\n'
              'forbidText(homepage, "mailto:", "homepage mailto bypass");\n'
              'forbidText(homepage, \'fetch("/api/lead"\', "homepage legacy lead endpoint");\n'
              'forbidText(homepage, "sendEmail", "homepage legacy email handler");\n'
              'forbidText(homepage, "ContactFields", "homepage duplicate form implementation");\n'
              'requireText(layout, "organizationJsonLd()", "canonical organization structured-data source");\n\n'
          )
          verifier = verifier.replace(verify_anchor, verify_anchor + checks, 1)
          verifier_path.write_text(verifier, encoding="utf-8")
          PY

          git diff --check
          node scripts/verify-inbound-acquisition.mjs

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit only bounded acquisition files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx scripts/verify-inbound-acquisition.mjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "app/page.tsx scripts/verify-inbound-acquisition.mjs "
          git commit -m 'Route homepage inquiries through governed contact flow'
          git push origin "HEAD:${GITHUB_REF_NAME}"
