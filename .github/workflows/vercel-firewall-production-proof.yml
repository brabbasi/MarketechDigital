name: Vercel Firewall Production Proof

on:
  push:
    branches:
      - ops/vercel-firewall-proof-20260919
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-firewall-production-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_OHRkafYU5Gg6L00qcwYYsq81
      VERCEL_PROJECT_ID: prj_iRZyxQA5Gh93mcrEt7Z6XSMN7HVJ
      REVIEWED_HEAD: dd33b705edf9465b60b7f5681b83d982384817bb
    steps:
      - name: Fail closed if Vercel API credential is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not available to this repository workflow; firewall state cannot be proven."
            exit 2
          fi

      - name: Checkout exact reviewed acquisition candidate
        uses: actions/checkout@v4
        with:
          ref: dd33b705edf9465b60b7f5681b83d982384817bb
          persist-credentials: false
          fetch-depth: 1

      - name: Verify live Vercel firewall against reviewed contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path(".marketech/inquiry-rate-limit-v1.json").read_text(encoding="utf-8"))
          expected = manifest["rule"]

          query = urllib.parse.urlencode({
              "projectId": os.environ["VERCEL_PROJECT_ID"],
              "teamId": os.environ["VERCEL_TEAM_ID"],
          })
          req = urllib.request.Request(
              "https://api.vercel.com/v1/security/firewall/config?" + query,
              headers={
                  "Authorization": "Bearer " + os.environ["VERCEL_TOKEN"],
                  "Accept": "application/json",
                  "User-Agent": "marketech-firewall-proof/1",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Vercel firewall API returned HTTP {response.status}")
              payload = json.load(response)

          active = payload.get("active") or {}
          rules = active.get("rules") or []
          candidates = [
              rule for rule in rules
              if rule.get("id") == expected["id"] or rule.get("name") == expected["id"]
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected exactly one active firewall rule matching {expected['id']!r}; found {len(candidates)}"
              )

          rule = candidates[0]
          conditions = []
          for group in rule.get("conditionGroup") or []:
              for condition in group.get("conditions") or []:
                  conditions.append(condition)

          def has_condition(kind, value):
              return any(
                  str(c.get("type", "")).lower() == kind
                  and str(c.get("value", "")).lower() == value
                  and not bool(c.get("neg", False))
                  for c in conditions
              )

          mitigate = ((rule.get("action") or {}).get("mitigate") or {})
          rate = mitigate.get("rateLimit") or {}
          keys = [str(x).lower() for x in (rate.get("keys") or [])]

          checks = {
              "firewall_enabled": bool(active.get("firewallEnabled")),
              "rule_active": bool(rule.get("active")),
              "rule_valid": rule.get("valid", True) is not False,
              "environment_production": has_condition("environment", expected["environment"]),
              "method_post": has_condition("method", expected["method"].lower()),
              "path_exact": has_condition("path", expected["path"]),
              "mitigation_rate_limit": str(mitigate.get("action", "")).lower() == "rate_limit",
              "algorithm_fixed_window": str(rate.get("algo", "")).lower() == expected["algorithm"],
              "window_60": int(rate.get("window", -1)) == int(expected["window_seconds"]),
              "limit_5": int(rate.get("limit", -1)) == int(expected["requests_per_window"]),
              "key_ip": keys == ["ip"],
              "limit_action": str(rate.get("action", "")).lower() == expected["limit_action"],
          }

          proof = {
              "schema_version": 1,
              "reviewed_head": os.environ["REVIEWED_HEAD"],
              "team_id": os.environ["VERCEL_TEAM_ID"],
              "project_id": os.environ["VERCEL_PROJECT_ID"],
              "active_config_id": active.get("id"),
              "active_config_version": active.get("version"),
              "rule_id": rule.get("id"),
              "rule_name": rule.get("name"),
              "checks": checks,
              "pass": all(checks.values()),
          }
          Path("vercel-firewall-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          if not proof["pass"]:
              raise SystemExit("Live Vercel firewall does not exactly satisfy the reviewed inquiry contract")
          PY

      - name: Publish sanitized proof summary
        if: always()
        shell: bash
        run: |
          if [ -f vercel-firewall-proof.json ]; then
            {
              echo "## Marketech inquiry firewall proof"
              echo
              echo '~~~json'
              cat vercel-firewall-proof.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized proof
        if: always() && hashFiles('vercel-firewall-proof.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vercel-firewall-production-proof
          path: vercel-firewall-proof.json
          if-no-files-found: error
          retention-days: 7
