name: Ottawa Revenue Offer Preview CI

on:
  push:
    branches:
      - revenue/ottawa-productized-offers-20261010
  pull_request:
    paths:
      - 'app/solutions/ottawa/**'
      - 'app/page.tsx'
      - 'app/GlobalLogoCube.tsx'
      - 'app/GlobalPageHeader.tsx'
      - 'app/contact/ContactClient.tsx'
      - 'app/sitemap.ts'
      - '.github/workflows/ottawa-offer-preview-ci.yml'

permissions:
  contents: read

jobs:
  compile-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without audit, lifecycle scripts or credentials
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck revised offer and contact surface
        run: npx tsc --noEmit
      - name: Build review-only website candidate
        run: npm run build
      - name: Confirm no new customer send endpoint
        run: |
          test -f app/solutions/ottawa/page.tsx
          test -f app/contact/ContactClient.tsx
          test -f app/api/lead/route.ts
          test ! -e app/solutions/ottawa/api
          grep -Fq 'href="/solutions/ottawa"' app/page.tsx
          grep -Fq 'href: "/solutions/ottawa"' app/GlobalLogoCube.tsx
          grep -Fq 'href: "/solutions/ottawa"' app/GlobalPageHeader.tsx
          echo 'REVENUE_ROUTE_HOME_AND_MOBILE_DICE_DISCOVERABLE=PASS'
          echo 'REVIEW_ONLY_NEW_OFFER_PAGE=PASS'
          echo 'CUSTOMER_OUTBOUND_AND_PUBLICATION=NOT_AUTHORIZED'
