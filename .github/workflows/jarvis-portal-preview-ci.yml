name: JARVIS Portal Preview CI

on:
  push:
    branches:
      - feature/jarvis-founder-portal-v1
    paths:
      - 'app/jarvis/**'
      - '.github/workflows/jarvis-portal-preview-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/jarvis/**'
      - '.github/workflows/jarvis-portal-preview-ci.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-portal-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
