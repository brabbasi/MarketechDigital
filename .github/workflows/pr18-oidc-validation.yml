name: PR18 OIDC Validation

on:
  push:
    branches:
      - ops/jarvis-mirror-oidc-runtime-fix

permissions:
  contents: read

concurrency:
  group: pr18-oidc-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JARVIS QA
        run: npm run qa:jarvis
