name: SEO Skill Sitemap Regression

on:
  pull_request:
    paths:
      - 'app/sitemap.ts'
      - 'tests/seo-skill-sitemap.test.mjs'
      - '.github/workflows/seo-skill-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - run: node --test tests/seo-skill-sitemap.test.mjs
