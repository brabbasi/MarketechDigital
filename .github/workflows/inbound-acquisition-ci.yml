name: Inbound Acquisition CI

on:
  pull_request:
    paths:
      - 'app/api/inquiry/**'
      - 'app/api/lead/**'
      - 'app/contact/ContactClient.tsx'
      - 'app/privacy/page.tsx'
      - 'app/GoogleAnalytics.tsx'
      - 'app/IdeaGenerator.tsx'
      - 'app/AcquisitionGuard.tsx'
      - 'app/AIAssistant.tsx'
      - 'app/UXFixLayer.tsx'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'package.json'
      - '.marketech/inquiry-rate-limit-v1.json'
      - 'scripts/verify-inbound-acquisition.mjs'
      - '.github/workflows/inbound-acquisition-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact reviewed checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical acquisition and popup guards
        run: node scripts/verify-inbound-acquisition.mjs

      - name: Install for no-secret CI without dependency lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Exercise synthetic inquiry route with no provider/network requests
        run: node --test scripts/test-ottawa-inquiry-handler.mjs

      - name: Typecheck and build site without deploying
        run: |
          npx tsc --noEmit
          npm run build

      - name: Confirm no production or customer authority
        run: |
          echo 'EXACT_HEAD_SOURCE_TESTED=YES'
          echo 'LIVE_OWNER_DELIVERY=NOT_TESTED'
          echo 'PRODUCTION_RELEASE=NOT_AUTHORIZED'
